ignoreWorkspaceRootCheck: true
catalogMode: prefer

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@types/node@26.6.6'
  - tsdown@0.23.3

trustPolicy: no-downgrade

update:
  ignoreDeps:
    - typescript@7

shellEmulator: true

packages:
  - playground
  - docs
  - packages/*
  - examples/*

allowBuilds:
  esbuild: true
  simple-git-hooks: true

catalogs:
  agentic:
    '@antfu/skills': ^0.1.2
    skills: ^1.7.4
  cli:
    '@antfu/eslint-config': ^10.0.0
    '@antfu/ni': ^30.6.0
    bumpp: ^12.3.0
    eslint: ^10.13.0
    eslint-plugin-slop: ^0.1.3
    eslint-plugin-sonarjs: ^4.2.2
    knip: ^6.43.0
    nano-staged: ^1.0.2
    publint: ^0.3.25
    simple-git-hooks: ^2.14.0
    taze: ^21.3.0
    tsdown: ^0.23.3
    tsx: ^4.23.15
    typescript: ^6.0.3
    vite: ^8.3.5
  inlined:
    '@antfu/utils': ^9.3.0
  prod:
    '@clack/prompts': ^1.8.1
    '@hono/node-server': ^2.1.5
    '@hono/zod-openapi': ^1.6.3
    defu: ^6.1.7
    hono: ^4.13.14
    nostics: ^1.3.0
    std-env: ^4.3.0
    unconfig: ^7.5.0
    yaml: ^2.9.1
    zod: ^4.6.7
  testing:
    tsdown-stale-guard: ^0.1.3
    tsnapi: ^1.5.0
    vitest: ^5.0.5
  types:
    '@types/node': ^26.6.6
  web:
    '@vitejs/plugin-vue': ^6.0.10
    unocss: ^66.12.0
    vite-plugin-singlefile: ^2.3.4
    vue: ^3.5.44
    vue-tsc: ^3.3.13
